<script>

function nearestIndex(records,time){let lo=0,hi=records.length-1;while(lo<hi){const mid=Math.floor((lo+hi)/2);if(stamp(records[mid].date)<time)lo=mid+1;else hi=mid;}return lo>0&&Math.abs(stamp(records[lo-1].date)-time)<=Math.abs(stamp(records[lo].date)-time)?lo-1:lo;}
function dailyRows(){const lookup=new Map(data.records.map(r=>[r.date,r]));const rows=[];for(let t=stamp(data.requested_start);t<=stamp(data.requested_end);t+=86400000){const day=new Date(t).toISOString().slice(0,10),r=lookup.get(day),error=(data.errors||[]).some(e=>e.date===day);rows.push([day,r?.total_10k||'',r?.total_100m||'',error?(r?'检查失败，保留上次数据':'请求失败'):r?'已发布':'官网当日无记录']);}return rows;}
function render(){

 for(let i=0;i<6;i++){const v=low+(high-low)*i/5,yy=y(v);s+=`<path d="M${L} ${yy}H${W-R}" stroke="#e0e8f0"/><text x="${L-12}" y="${yy+5}" text-anchor="end" fill="#52657a" font-size="14">${v.toFixed(1)}</text>`;}

}
function show(index){selected=index;const r=data.records[index],{x,y}=layout,xx=x(stamp(r.date)),yy=y(Number(r.total_100m));el('cursor').setAttribute('visibility','visible');el('crosshair').setAttribute('x1',xx);el('crosshair').setAttribute('x2',xx);el('dot').setAttribute('cx',xx);el('dot').setAttribute('cy',yy);const tip=el('tooltip');tip.innerHTML=`<b>${r.date}</b><br>总份额：${fmt(r.total_10k)} 万份<br>${fmt(r.total_100m,6)} 亿份`;tip.style.display='block';const box=el('chart').getBoundingClientRect();tip.style.left=Math.max(0,Math.min(xx/1100*box.width+14,box.width-tip.offsetWidth))+'px';tip.style.top=Math.max(0,yy/460*box.height-tip.offsetHeight-12)+'px';}
